// Types the Compose compiler cannot prove stable but that are, so composables taking them skip
// when they are equal instead of only when they are the same instance. Read by every Compose
// module through configureComposeCompiler in build-logic. See docs/performance.md.

// core:model is a plain JVM module, so the compiler never sees its classes. They are data
// classes, enums and value classes of vals, with no setters and nothing mutable inside.
com.pierre.tunescout.core.model.**

// Read-only collections. Every list and set that reaches a UI state is built by a map, a filter
// or a Room query and never mutated after, so equal contents mean an equal screen.
kotlin.collections.List
kotlin.collections.Set
