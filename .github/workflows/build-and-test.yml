name: build-and-test

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # verifyNewFilesCoverage diffs against the tip of the base branch, which a depth-1 checkout of
      # the pull request's merge commit does not bring. On main the diff is empty and the task passes.
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      # The plain test tasks stay: :ui:* and :tools:* have tests but are left out of the coverage
      # report, so the Kover tasks alone would not run them. See docs/code-quality.md.
      - name: Run unit tests and verify coverage
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: >
          ./gradlew testDebugUnitTest test :koverVerifyCi :verifyNewFilesCoverage :koverHtmlReportCi
          -Pcoverage.baseRef="origin/$BASE_REF" --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/

  build:
    runs-on: ubuntu-latest
    # The longest job after the emulators, see .github/actions/gradle. unit-tests stays read-only:
    # even a cold run of it finishes first, and every writer takes its share of the 10 GB budget.
    env:
      GRADLE_CACHE_WRITE_ON_PULL_REQUESTS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Release matters: it is the only variant where R8 runs, so a missing keep rule for
      # kotlinx.serialization or Room surfaces here instead of on a device.
      # Scoped to :app on purpose. The root `assemble*` tasks also bundle a debug and a release AAR
      # for every library module, about 300 uncacheable tasks whose output nothing consumes; :app
      # already compiles every production module on its way to the APK.
      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tunescout-debug
          path: app/build/outputs/apk/debug/app-debug.apk
