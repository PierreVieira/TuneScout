name: instrumented-tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Compiling before the emulator exists gives Gradle all four cores, and a compilation error
      # fails the job without paying for the SDK download and the boot.
      - name: Assemble the app and the test APKs
        run: ./gradlew :app:assembleDebug assembleDebugAndroidTest

      # Caching the AVD was measured on this workflow and dropped: it saved about 20s, inside the
      # run-to-run noise, while its 1.3 GB entry crowded the repository's 10 GB cache budget and
      # evicted the Gradle dependency caches that every job depends on.
      # JUnit 6 on device needs API 35+ (Java 17 baseline)
      - name: Run Compose screen tests and end-to-end flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # The APKs are already built, so Gradle only drives the device from here on and the
          # emulator can have the cores the default of 2 leaves idle. Compose renders on the CPU
          # under swiftshader, which makes the test phase scale with them.
          cores: 3
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --continue

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: '**/build/reports/androidTests/**'
