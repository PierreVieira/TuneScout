name: instrumented-tests

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The device runs one module's tests at a time, so that phase grows with every module and is the
  # longest part of this job. Each shard boots its own emulator and takes every other module with
  # a src/androidTest directory; scripts/instrumented_shard.sh deals them out, so nothing here
  # needs editing when a module is added. Keep SHARD_COUNT equal to the length of matrix.shard.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      SHARD_COUNT: 2
      # The slowest job of a pull request, and compilation is over half of a cold run. See
      # .github/actions/gradle.
      GRADLE_CACHE_WRITE_ON_PULL_REQUESTS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Compiling before the emulator exists gives Gradle all four cores, and a compilation error
      # fails the job without paying for the SDK download and the boot.
      - name: Assemble the shard's APKs
        run: ./gradlew $(./scripts/instrumented_shard.sh assemble ${{ matrix.shard }} "$SHARD_COUNT")

      # Caching the AVD was measured on this workflow and dropped: it saved about 20s, inside the
      # run-to-run noise, while its 1.3 GB entry crowded the repository's 10 GB cache budget and
      # evicted the Gradle dependency caches that every job depends on.
      # JUnit 6 on device needs API 35+ (Java 17 baseline)
      - name: Run Compose screen tests and end-to-end flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew $(./scripts/instrumented_shard.sh connected ${{ matrix.shard }} "$SHARD_COUNT") --continue

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-shard-${{ matrix.shard }}
          path: '**/build/reports/androidTests/**'
