name: release

# Cuts a release from main, by hand: bumps the version, builds the release APK signed with the
# project's key, publishes it on a GitHub release tagged <version>, and opens the pull request
# that carries the bump back to main. See docs/ci.md#release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the version to bump. none releases the version main already has.'
        type: choice
        required: true
        default: patch
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

# Two releases at once would compute the same version from the same main, so the second one waits
# for the first and then fails on the tag it created.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Compiles the release variant that build in build-and-test compiled on main, so it reads that
    # job's cache entry and never saves one of its own. See .github/actions/gradle.
    env:
      GRADLE_CACHE_READ_ONLY: true
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse to release from another branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not from $GITHUB_REF_NAME."
          exit 1

      # Before anything is built or pushed: a release signed with the runner's debug key, which is
      # different on every run, could never update the previous one on a device.
      - name: Check the signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. How to create them is in docs/ci.md#release."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 scripts/bump_version.py "$BUMP" | tee -a "$GITHUB_OUTPUT"

      # A tag that already exists means this version was released: either main's version was
      # released as is and the run asked for `none`, or the previous bump pull request is not
      # merged yet, so the bump landed on the same number again.
      - name: Check the version is new
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::$VERSION is already released. Merge its bump pull request, or pick a bump."
            exit 1
          fi
          if [ "$BUMP" != none ] \
            && git ls-remote --exit-code --heads origin "refs/heads/chore/bump-version-$VERSION" > /dev/null; then
            echo "::error::chore/bump-version-$VERSION already exists: a previous run pushed it. Merge or delete it first."
            exit 1
          fi

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode the keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Built before anything is pushed, so a build failure leaves no branch, tag or release behind.
      - name: Assemble the signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # The release is built from, and tagged on, this commit: the APK and the tag carry the same
      # version. The pull request brings it to main.
      - name: Push the bump
        if: inputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "chore/bump-version-$VERSION"
          git add app/build.gradle.kts
          git commit -m "chore: bump the version to $VERSION"
          git push -u origin HEAD

      - name: Publish the release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "tunescout-$VERSION.apk"
          # Deobfuscates the stack traces of this build; the APK alone cannot
          cp app/build/outputs/mapping/release/mapping.txt "tunescout-$VERSION-mapping.txt"
          gh release create "$VERSION" "tunescout-$VERSION.apk" "tunescout-$VERSION-mapping.txt" \
            --target "$(git rev-parse HEAD)" --title "$VERSION" --generate-notes
          echo "url=$(gh release view "$VERSION" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      # Pushed from the workflow's own token, so the checks do not run on this pull request: the
      # only change is the two version lines, on the commit this very run built and released.
      - name: Open the bump pull request
        if: inputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Brings the version of [$VERSION]($RELEASE_URL) to \`main\`: \`versionName\` $VERSION,
          \`versionCode\` $VERSION_CODE.

          Opened by the \`release\` workflow. The release was built from this branch's commit and
          its tag points at it, so nothing but the two version lines changes here. Merge it before
          cutting the next release, or that run stops on the tag this one created.
          EOF
          gh pr create \
            --base main \
            --head "chore/bump-version-$VERSION" \
            --title "chore: bump the version to $VERSION" \
            --assignee "$GITHUB_ACTOR" \
            --body-file "$RUNNER_TEMP/pr-body.md"
