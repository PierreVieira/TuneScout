name: 'Setup Gradle and Java'
description: 'Sets up JDK 21 and Gradle with caching'

inputs:
  cache-encryption-key:
    description: >-
      Secret used to encrypt the Gradle configuration cache before storing it. Without it the
      configuration cache is discarded between runs, so every job pays full configuration time.
    required: false
    default: ''
  cache-read-only:
    description: >-
      The default is setup-gradle's own: only the default branch writes the cache, so every push
      to a pull request starts from main's entries and recompiles the whole diff again. Jobs on
      the pull request's critical path pass 'false': the entry is scoped to the pull request's
      ref, so the next push restores it and only compiles what changed since the previous one.
    required: false
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
